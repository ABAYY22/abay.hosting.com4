<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">

        <div id="hud">
            <span id="score">Score: 0</span>
            <span id="highscore">High Score: 0</span>
        </div>

        <canvas id="gameCanvas" width="1000" height="350"></canvas>

        <div id="menu">
            <h1>DINO RUNNER</h1>

            <p>Tekan <b>SPACE</b>, <b>W</b>, atau <b>↑</b> untuk mulai.</p>

            <button id="startBtn">
                Mulai Bermain
            </button>
        </div>

        <div id="gameOver" class="hidden">
            <h1>GAME OVER</h1>

            <p>Tekan R atau klik tombol di bawah.</p>

            <button id="restartBtn">
                Main Lagi
            </button>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="game.js"></script>

</body>
</html>
